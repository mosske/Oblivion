<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Circular Halo Ring Gradient: Rich Pink & Sunset Orange to Cyan & Violet -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>    <!-- Hot Neon Pink -->
      <stop offset="25%" stop-color="#ff4500"/>   <!-- Orange Red -->
      <stop offset="48%" stop-color="#ff9a00"/>   <!-- Radiant Sunset Orange -->
      <stop offset="72%" stop-color="#00d4ff"/>   <!-- Electric Cyan -->
      <stop offset="100%" stop-color="#c026d3"/>  <!-- Vibrant Fuchsia / Purple -->
    </linearGradient>

    <!-- Outer Glow Aura for depth on dark or light backgrounds -->
    <radialGradient id="discAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#ff5722" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#9333ea" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Apex Left: Luminous Pink & Sunset Orange -->
    <linearGradient id="topApexLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ff80b0"/>
      <stop offset="65%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>

    <linearGradient id="topApexCenter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fed7aa"/>
      <stop offset="75%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="topApexRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Vertical Shaft Left: Rich Neon Pink into Radiant Orange -->
    <linearGradient id="shaftLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="35%" stop-color="#ff2a6d"/>
      <stop offset="70%" stop-color="#ff5e00"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>

    <!-- Vertical Shaft Center: Prismatic spectrum shimmer with pink & orange sheen -->
    <linearGradient id="shaftCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a8b"/>
      <stop offset="30%" stop-color="#ff6a88"/>
      <stop offset="60%" stop-color="#ff9900"/>
      <stop offset="85%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>

    <!-- Vertical Shaft Right: Cyan to Deep Blue-Purple -->
    <linearGradient id="shaftRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <!-- Bottom Inverted Apex Left: Radiant Orange-Pink into Crimson -->
    <linearGradient id="botApexLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5e00"/>
      <stop offset="45%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>

    <!-- Bottom Inverted Apex Center: Sunset Magenta-Orange -->
    <linearGradient id="botApexCenter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#701a75"/>
    </linearGradient>

    <!-- Bottom Inverted Apex Right: Indigo & Purple -->
    <linearGradient id="botApexRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>

    <!-- Filters for Radiant Crystal Bloom -->
    <filter id="crystalBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="haloGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing Disc Aura Backdrop -->
  <circle cx="256" cy="256" r="236" fill="url(#discAura)" filter="url(#haloGlow)"/>

  <!-- ================= 1. SOLID PITCH BLACK INNER BACKGROUND ================= -->
  <!-- Fills the entire interior behind the crystal with deep black -->
  <circle cx="256" cy="256" r="226" fill="#040207"/>

  <!-- ================= 2. CIRCULAR SPECTRUM RING (Enlarged Full Size) ================= -->
  <!-- Outer Halo Ring Orbit (Pink, Orange, Cyan, Purple) -->
  <circle cx="256" cy="256" r="216" stroke="url(#ringGrad)" stroke-width="28" fill="none" stroke-linecap="round"/>
  <!-- Inner crisp highlight line on ring -->
  <circle cx="256" cy="256" r="216" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.4" fill="none"/>

  <!-- ================= 3. ENLARGED VERTICAL DOUBLE-TERMINATED CRYSTAL ================= -->
  <!-- Crystal Outer Glow/Aura -->
  <polygon points="256,24 176,136 176,376 256,488 336,376 336,136" fill="url(#ringGrad)" fill-opacity="0.25" filter="url(#crystalBloom)"/>

  <!-- Center Crystal Body Facets -->
  <!-- Left Vertical Shaft (Pink & Orange) -->
  <polygon points="176,136 256,164 256,348 176,376" fill="url(#shaftLeft)"/>
  <!-- Center Pillar Reflection / Prism Core (Pink-Orange-Cyan Shimmer) -->
  <polygon points="218,154 294,154 294,358 218,358" fill="url(#shaftCenter)" fill-opacity="0.9"/>
  <!-- Right Vertical Shaft (Cyan & Blue) -->
  <polygon points="256,164 336,136 336,376 256,348" fill="url(#shaftRight)"/>

  <!-- Top Apex Pyramid Facets -->
  <!-- Top Left Facet (Luminous Pink & Sunset Orange) -->
  <polygon points="256,24 176,136 256,164" fill="url(#topApexLeft)"/>
  <!-- Top Center Glow Point -->
  <polygon points="256,24 232,108 256,136 280,108" fill="url(#topApexCenter)" fill-opacity="0.95"/>
  <!-- Top Right Facet (Cyan to Indigo) -->
  <polygon points="256,24 256,164 336,136" fill="url(#topApexRight)"/>

  <!-- Bottom Apex Inverted Pyramid Facets -->
  <!-- Bottom Left Facet (Radiant Orange-Pink into Crimson) -->
  <polygon points="176,376 256,348 256,488" fill="url(#botApexLeft)"/>
  <!-- Bottom Center Shimmer -->
  <polygon points="256,488 232,404 256,376 280,404" fill="url(#botApexCenter)" fill-opacity="0.92"/>
  <!-- Bottom Right Facet (Indigo & Purple) -->
  <polygon points="256,348 336,376 256,488" fill="url(#botApexRight)"/>

  <!-- ================= 4. LUMINOUS CRISP FACET EDGES ================= -->
  <!-- Vertical Spine Ridge -->
  <line x1="256" y1="24" x2="256" y2="488" stroke="#ffffff" stroke-width="4" stroke-opacity="0.95" stroke-linecap="round"/>
  <!-- Top Apex Ridges -->
  <line x1="256" y1="24" x2="176" y2="136" stroke="#ffffff" stroke-width="3.2" stroke-opacity="0.95"/>
  <line x1="256" y1="24" x2="336" y2="136" stroke="#e0f2fe" stroke-width="3.2" stroke-opacity="0.9"/>
  <!-- Top Shoulder Horizontal Ridges -->
  <line x1="176" y1="136" x2="256" y2="164" stroke="#fed7aa" stroke-width="2.8" stroke-opacity="0.9"/>
  <line x1="256" y1="164" x2="336" y2="136" stroke="#e0e7ff" stroke-width="2.8" stroke-opacity="0.85"/>

  <!-- Outer Vertical Edges -->
  <line x1="176" y1="136" x2="176" y2="376" stroke="#ff9a8b" stroke-width="2.8" stroke-opacity="0.9"/>
  <line x1="336" y1="136" x2="336" y2="376" stroke="#7dd3fc" stroke-width="2.8" stroke-opacity="0.85"/>

  <!-- Bottom Shoulder Horizontal Ridges -->
  <line x1="176" y1="376" x2="256" y2="348" stroke="#ff758c" stroke-width="2.8" stroke-opacity="0.9"/>
  <line x1="256" y1="348" x2="336" y2="376" stroke="#818cf8" stroke-width="2.8" stroke-opacity="0.85"/>
  <!-- Bottom Apex Ridges -->
  <line x1="176" y1="376" x2="256" y2="488" stroke="#f43f5e" stroke-width="3.2" stroke-opacity="0.9"/>
  <line x1="336" y1="376" x2="256" y2="488" stroke="#60a5fa" stroke-width="3.2" stroke-opacity="0.9"/>

  <!-- Apex Star Sparkle -->
  <circle cx="256" cy="24" r="6" fill="#ffffff"/>
  <circle cx="256" cy="488" r="4.5" fill="#ffffff"/>
</svg>
