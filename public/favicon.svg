<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="210" stroke="#1e293b" stroke-width="6"/>
  <circle cx="256" cy="256" r="160" stroke="#0f172a" stroke-width="4"/>
  
  <!-- Outer glowing wave ring -->
  <circle cx="256" cy="256" r="120" stroke="url(#neonGlow)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Music Frequency Bars & Play Mark -->
  <g fill="url(#neonGlow)">
    <rect x="160" y="216" width="16" height="80" rx="8"/>
    <rect x="196" y="176" width="16" height="160" rx="8"/>
    <rect x="232" y="140" width="16" height="232" rx="8"/>
    <rect x="268" y="160" width="16" height="192" rx="8"/>
    <rect x="304" y="200" width="16" height="112" rx="8"/>
    <rect x="340" y="230" width="16" height="52" rx="8"/>
  </g>
  
  <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#glow)"/>
</svg>
