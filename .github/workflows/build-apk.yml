name: Build Oblivion APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android platform
        run: npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK (release)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/release/*.apk
          include-hidden-files: true

      - name: Create GitHub Release
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          VERSION="${{ github.sha }}"
          NAME="app-release.apk"
          BODY="Automated APK build for commit \`${VERSION}\`."
          RESPONSE=$(curl -sS https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest)
          RELEASE_ID=$(echo "$RESPONSE" | grep -m1 '"id"' | sed 's/.*: "//; s/",//')
          curl -sS -X POST https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/releases/${RELEASE_ID}/assets \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -F "name=${NAME}" \
            -F "label"=@android/app/release/*.apk

      - name: Upload APK to Release (non-main)
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          set -euo pipefail
          VERSION="${{ github.sha }}"
          NAME="app-release.apk"
          RESPONSE=$(curl -sS https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest)
          RELEASE_ID=$(echo "$RESPONSE" | grep -m1 '"id"' | sed 's/.*: "//; s/",//')
          curl -sS -X POST https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/releases/${RELEASE_ID}/assets \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -F "name=${NAME}" \
            -F "label"=@android/app/release/*.apk
